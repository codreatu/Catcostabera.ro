<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Cât Costă Berea? — Harta prețurilor la bere în România</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --stout:#1B1207;
    --stout-2:#2A1D0E;
    --foam:#FBF3E4;
    --lager:#F0A31A;
    --amber:#C56E1A;
    --hop:#5B8A4A;
    --line:rgba(251,243,228,.14);
    --cheap:#5FAE4A;
    --mid:#F0A31A;
    --pricey:#D6503F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--stout);color:var(--foam);overflow:hidden}
  #map{position:fixed;inset:0;z-index:1;background:#12100c}
  .leaflet-container{font-family:'Archivo',sans-serif}

  /* ---------- Bottle-cap price markers ---------- */
  .cap{
    width:46px;height:46px;border-radius:50%;
    background:var(--lager);color:var(--stout);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:700;line-height:1;
    box-shadow:0 3px 10px rgba(0,0,0,.55);
    border:2px solid var(--stout);
    position:relative;transition:transform .12s ease;
  }
  .cap::before{
    content:"";position:absolute;inset:-5px;border-radius:50%;z-index:-1;
    background:repeating-conic-gradient(var(--lager) 0deg 9deg, transparent 9deg 18deg);
  }
  .cap.cheap{background:var(--cheap)}
  .cap.cheap::before{background:repeating-conic-gradient(var(--cheap) 0deg 9deg, transparent 9deg 18deg)}
  .cap.mid{background:var(--mid)}
  .cap.mid::before{background:repeating-conic-gradient(var(--mid) 0deg 9deg, transparent 9deg 18deg)}
  .cap.pricey{background:var(--pricey)}
  .cap.pricey::before{background:repeating-conic-gradient(var(--pricey) 0deg 9deg, transparent 9deg 18deg)}
  .cap.closed{background:#6b6257}
  .cap.closed::before{background:repeating-conic-gradient(#6b6257 0deg 9deg, transparent 9deg 18deg)}
  .cap.hh::after{
    content:"HH";position:absolute;top:-12px;right:-14px;
    background:var(--hop);color:var(--foam);font-size:9px;font-weight:700;
    padding:2px 5px;border-radius:99px;letter-spacing:.5px;border:1.5px solid var(--stout);
  }
  .cap .from{font-size:6px;font-weight:600;letter-spacing:.4px;text-transform:lowercase;opacity:.85;line-height:1}
  .cap .lei{font-size:14px;line-height:1}
  .cap .cur{font-size:8px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-top:1px}
  .cap:hover{transform:scale(1.12)}
  .capwrap{background:none;border:none}

  /* ---------- City aggregate markers (national zoom) ---------- */
  .citycap{
    min-width:72px;padding:8px 10px 7px;border-radius:12px;
    background:var(--stout);border:2px solid var(--lager);
    color:var(--foam);text-align:center;line-height:1.15;
    box-shadow:0 4px 14px rgba(0,0,0,.6);cursor:pointer;
    transition:transform .12s ease;white-space:nowrap;
  }
  .citycap:hover{transform:scale(1.07)}
  .citycap .cn{font-family:'Archivo Black';font-size:12px}
  .citycap .cs{font-size:10.5px;margin-top:2px;opacity:.9}
  .citycap .cs b{color:var(--lager)}

  /* ---------- Top bar ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    background:linear-gradient(to bottom, rgba(27,18,7,.96) 60%, rgba(27,18,7,0));
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:10px;pointer-events:auto}
  .brand-cap{
    width:34px;height:34px;border-radius:50%;flex:none;
    background:var(--lager);display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black';font-size:15px;color:var(--stout);
    box-shadow:inset 0 0 0 2px var(--stout), 0 0 0 3px var(--lager);
  }
  h1{font-family:'Archivo Black',sans-serif;font-size:19px;letter-spacing:.2px}
  h1 span{color:var(--lager)}
  .sub{font-size:11px;opacity:.75;margin-top:1px}

  .row{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;pointer-events:auto;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{
    flex:none;display:flex;align-items:center;gap:6px;
    background:var(--stout-2);border:1px solid var(--line);color:var(--foam);
    font-family:'Archivo';font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;
  }
  .chip.on{background:var(--lager);color:var(--stout);border-color:var(--lager)}
  .chip.city.on{background:var(--foam);border-color:var(--foam)}
  .chip:focus-visible,.iconbtn:focus-visible,.listrow:focus-visible{outline:2px solid var(--lager);outline-offset:2px}

  /* ---------- List drawer ---------- */
  .drawer{
    position:fixed;left:0;right:0;bottom:0;z-index:1001;
    background:var(--stout);border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    transform:translateY(calc(100% - 58px));
    transition:transform .25s ease;
    max-height:72vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .drawer.open{transform:translateY(0)}
  .drawer-handle{
    padding:10px 16px 12px;cursor:pointer;text-align:left;position:relative;
    background:none;border:none;color:var(--foam);width:100%;
    font-family:'Archivo';display:flex;align-items:center;justify-content:space-between;
  }
  .drawer-handle b{font-size:14px}
  .drawer-handle .bar-count{color:var(--lager)}
  .drawer-handle::before{
    content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:36px;height:4px;border-radius:99px;background:var(--line);
  }
  .list{overflow-y:auto;padding:0 8px 12px}
  .listrow{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--line);
    padding:12px 8px;cursor:pointer;color:var(--foam);font-family:'Archivo';
  }
  .listrow .mini{
    width:44px;height:44px;border-radius:50%;flex:none;
    background:var(--lager);color:var(--stout);font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .listrow.closed-row .mini{background:#6b6257}
  .listrow .rn{font-weight:700;font-size:14px}
  .listrow .rm{font-size:12px;opacity:.7;margin-top:2px}
  .listrow .tag-hh{color:#a5d194;font-weight:700}
  .listrow .dist{margin-left:auto;font-size:12px;opacity:.75;flex:none;text-align:right}
  .listrow .dist .cty{display:block;font-size:10px;opacity:.7}

  /* ---------- Detail card ---------- */
  .detail{
    position:fixed;left:0;right:0;bottom:0;z-index:1002;
    background:var(--stout);border-top:2px solid var(--lager);
    border-radius:18px 18px 0 0;
    transform:translateY(105%);transition:transform .25s ease;
    max-height:78vh;overflow-y:auto;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .detail.open{transform:translateY(0)}
  .d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .d-name{font-family:'Archivo Black';font-size:21px;line-height:1.15}
  .d-meta{font-size:13px;opacity:.75;margin-top:4px}
  .iconbtn{
    background:var(--stout-2);border:1px solid var(--line);color:var(--foam);
    width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;flex:none;
  }
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-top:10px}
  .dot{width:8px;height:8px;border-radius:50%}
  .status.o{color:#8fc47e}.status.o .dot{background:#8fc47e}
  .status.c{color:#e08a80}.status.c .dot{background:#e08a80}
  .hhbox{
    margin-top:12px;background:rgba(91,138,74,.16);border:1px solid rgba(91,138,74,.5);
    border-radius:10px;padding:10px 12px;font-size:13px;
  }
  .hhbox b{color:#a5d194}
  .menu{margin-top:16px}
  .menu h3{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;margin-bottom:8px}
  .beer{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
  .beer .bp{font-weight:700;color:var(--lager);font-size:15px}
  .beer .bp.cheap{color:var(--cheap)}
  .beer .bp.mid{color:var(--mid)}
  .beer .bp.pricey{color:var(--pricey)}
  .beer .bp-group{display:inline-flex;flex-wrap:wrap;justify-content:flex-end;column-gap:4px}
  .beer .bp-sep{opacity:.4;font-weight:400;font-size:13px;align-self:center}
  .beer .bv{opacity:.55;font-size:12px;margin-left:6px}
  .d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .d-tags span{font-size:12px;background:var(--stout-2);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
  .d-note{font-size:11px;opacity:.5;margin-top:14px}

  .demo-badge{
    position:fixed;z-index:999;right:10px;bottom:66px;
    font-size:10px;letter-spacing:.6px;background:rgba(27,18,7,.85);
    border:1px solid var(--line);padding:4px 8px;border-radius:6px;opacity:.85;
  }
  .country-btn{
    position:fixed;z-index:999;left:10px;bottom:66px;
    background:rgba(27,18,7,.9);border:1px solid var(--line);color:var(--foam);
    font-family:'Archivo';font-size:12px;font-weight:600;
    padding:8px 12px;border-radius:99px;cursor:pointer;
  }
  .leaflet-control-attribution{background:rgba(27,18,7,.7)!important;color:#a99!important;font-size:9px!important}
  .leaflet-control-attribution a{color:#c9a!important}

  /* ---------- Add-a-bar ---------- */
  .add-btn{
    position:fixed;z-index:1001;left:50%;transform:translateX(-50%);bottom:66px;
    background:var(--lager);border:none;color:var(--stout);
    font-family:'Archivo';font-size:13px;font-weight:700;
    padding:10px 18px;border-radius:99px;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .add-panel{
    position:fixed;left:0;right:0;bottom:0;z-index:1003;
    background:var(--stout);border-top:2px solid var(--lager);
    border-radius:18px 18px 0 0;
    transform:translateY(105%);transition:transform .25s ease;
    max-height:88vh;overflow-y:auto;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .add-panel.open{transform:translateY(0)}
  .add-panel.picking{transform:translateY(105%)}
  .pin-hint{
    position:fixed;z-index:1004;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:var(--lager);color:var(--stout);font-family:'Archivo';font-size:13px;font-weight:700;
    padding:9px 16px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.5);
    display:none;white-space:nowrap;
  }
  .pin-hint.show{display:block}
  .add-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  .add-top h2{font-family:'Archivo Black';font-size:19px}
  .field{margin-top:14px}
  .field label{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.65;margin-bottom:6px}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1;margin-top:0}
  .add-panel input[type="text"],.add-panel input[type="number"],.add-panel select{
    width:100%;background:var(--stout-2);border:1px solid var(--line);color:var(--foam);
    font-family:'Archivo';font-size:15px;padding:11px 14px;border-radius:12px;
  }
  .add-panel input::placeholder{color:rgba(251,243,228,.35)}
  .add-panel select{appearance:none;-webkit-appearance:none}
  #afGeoQuery.loading{opacity:.6}
  .geo-status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
  .pin-status{font-size:12px;opacity:.6}
  .pin-status.set{opacity:1;color:var(--cheap)}
  .pin-status.err{opacity:1;color:var(--pricey)}
  .pin-link{background:none;border:none;color:var(--foam);text-decoration:underline;font-family:'Archivo';font-size:11.5px;cursor:pointer;padding:0;white-space:nowrap}
  .pin-link.picking{color:var(--lager);font-weight:700}
  .geo-results{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .geo-result{
    display:block;width:100%;text-align:left;background:var(--stout-2);border:none;border-bottom:1px solid var(--line);
    color:var(--foam);font-family:'Archivo';font-size:12.5px;line-height:1.4;padding:10px 12px;cursor:pointer;
  }
  .geo-result:last-child{border-bottom:none}
  .geo-result:hover{background:#33240f}
  .geo-attrib{font-size:10px;opacity:.4;text-align:right;padding:6px 12px 2px;background:var(--stout-2)}
  .beer-block{
    margin-top:10px;border:1px dashed var(--line);border-radius:12px;padding:12px;position:relative;
  }
  .beer-block .field-row{margin-top:10px}
  .beer-block .field-row:first-child{margin-top:0}
  .beer-remove{
    position:absolute;top:8px;right:8px;background:none;border:none;color:var(--foam);
    opacity:.5;font-size:14px;cursor:pointer;padding:4px;
  }
  .add-beer-btn{
    margin-top:10px;width:100%;background:none;border:1px dashed var(--line);color:var(--foam);
    font-family:'Archivo';font-size:13px;font-weight:600;padding:10px;border-radius:12px;cursor:pointer;opacity:.85;
  }
  .submit-btn{
    margin-top:18px;width:100%;background:var(--lager);border:none;color:var(--stout);
    font-family:'Archivo';font-size:15px;font-weight:700;padding:14px;border-radius:12px;cursor:pointer;
  }
  .submit-btn:disabled{opacity:.5;cursor:default}
  .form-msg{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:10px;display:none}
  .form-msg.show{display:block}
  .form-msg.ok{background:rgba(95,174,74,.16);border:1px solid rgba(95,174,74,.5);color:#a5d194}
  .form-msg.err{background:rgba(214,80,63,.16);border:1px solid rgba(214,80,63,.5);color:#e08a80}

  @media (prefers-reduced-motion: reduce){.drawer,.detail,.add-panel,.cap,.citycap{transition:none}}
  @media(min-width:760px){
    .drawer,.detail,.add-panel{left:auto;right:16px;width:400px;border-radius:14px}
    .drawer{bottom:16px}
    .detail{bottom:16px;border:1px solid var(--line);border-top:2px solid var(--lager)}
    .add-panel{bottom:16px;border:1px solid var(--line);border-top:2px solid var(--lager)}
    .add-btn{left:auto;right:16px;bottom:66px;transform:none}
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Harta barurilor din România"></div>

<header>
  <div class="brand">
    <div class="brand-cap">B</div>
    <div>
      <h1>Cât Costă <span>Berea?</span></h1>
      <div class="sub">Prețuri la bere în <b>România</b> · <span id="statCount"></span></div>
    </div>
  </div>
  <div class="row" id="cityRow" role="toolbar" aria-label="Orașe"></div>
</header>

<div class="demo-badge" id="dataBadge">Se încarcă prețurile…</div>
<button class="country-btn" id="btnCountry">🇷🇴 Toată România</button>
<button class="add-btn" id="btnAdd">+ Adaugă</button>
<div class="pin-hint" id="pinHint">📍 Atinge harta pentru a pune pinul</div>

<section class="drawer" id="drawer">
  <button class="drawer-handle" id="drawerToggle" aria-expanded="false">
    <b><span class="bar-count" id="listCount">0</span> baruri</b>
    <span id="drawerArrow">▲</span>
  </button>
  <div class="list" id="list"></div>
</section>

<section class="detail" id="detail" aria-live="polite"></section>

<section class="add-panel" id="addPanel" aria-live="polite">
  <div class="add-top">
    <h2>Adaugă un bar</h2>
    <button class="iconbtn" id="addClose" aria-label="Închide">✕</button>
  </div>

  <form id="addForm">
    <div class="field">
      <label for="afName">Numele barului</label>
      <input type="text" id="afName" placeholder="ex. Berăria Lipscani" required>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="afCitySelect">Oraș</label>
        <select id="afCitySelect">
          <option value="">— alege —</option>
          <option value="__new__">+ Oraș nou</option>
        </select>
        <input type="text" id="afCityNew" placeholder="Nume oraș nou" style="margin-top:8px;display:none">
      </div>
      <div class="field">
        <label for="afNeighborhood">Cartier</label>
        <input type="text" id="afNeighborhood" placeholder="ex. Centrul Vechi">
      </div>
    </div>

    <div class="field">
      <label for="afGeoQuery">Locație pe hartă</label>
      <input type="text" id="afGeoQuery" placeholder="Scrie adresa… ex. Str. Lipscani 41" autocomplete="off">
      <div id="afGeoResults"></div>
      <div class="geo-status-row">
        <span class="pin-status" id="afPinStatus">nesetat</span>
        <button type="button" class="pin-link" id="afPinBtn">📍 pune pinul manual</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="afLat">Lat</label>
        <input type="number" id="afLat" step="any" placeholder="ex. 44.4318">
      </div>
      <div class="field">
        <label for="afLng">Lng</label>
        <input type="number" id="afLng" step="any" placeholder="ex. 26.1005">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="afOpen">Deschide (oră)</label>
        <input type="number" id="afOpen" min="0" max="23" step="1" placeholder="ex. 12">
      </div>
      <div class="field">
        <label for="afClose">Închide (oră)</label>
        <input type="number" id="afClose" min="0" max="23" step="1" placeholder="ex. 2">
      </div>
    </div>

    <div class="field" style="margin-top:20px">
      <label>Ce bere?</label>
      <div id="beerList"></div>
      <datalist id="volList">
        <option value="0.3l"><option value="0.33l"><option value="0.4l">
        <option value="0.5l"><option value="0.75l"><option value="1l">
      </datalist>
      <button type="button" class="add-beer-btn" id="addBeerBtn">+ Adaugă altă bere</button>
    </div>

    <button type="submit" class="submit-btn" id="afSubmit">Trimite barul</button>
    <div class="form-msg" id="afMsg"></div>
  </form>
</section>

<script>
// ---------------- Live data (Google Sheet) ----------------
// The site loads bars from a public Google Sheet on every page load (see
// loadBarsFromSheet() near the bottom). CITIES is derived from whichever
// bar list ends up active, so a new city in the sheet just works — no
// code change needed. FALLBACK_BARS below is used only if the sheet
// can't be reached (offline, sharing revoked, etc).
let BARS = [];
let CITIES = [];

// ---------------- Fallback data (used if the sheet can't be reached) ----------------
const FALLBACK_BARS = [
 // București
 {c:"București", n:"Berăria Lipscani", a:"Str. Lipscani 41, Centrul Vechi", lat:44.4318, lng:26.1005,
  hours:[12,26], hh:{d:[1,2,3,4,5],from:16,to:19,deal:"Ursus draft 8 lei"},
  beers:[["Ursus draft",10,"0.5l"],["Timișoreana",9,"0.5l"],["Silva Dark",13,"0.5l"],["IPA artizanală",17,"0.4l"]],
  tags:["Terasă","Ecran sport","Card acceptat"]},
 {c:"București", n:"Halba la Smârdan", a:"Str. Smârdan 18, Centrul Vechi", lat:44.4306, lng:26.1019,
  hours:[14,27], hh:null,
  beers:[["Timișoreana",8,"0.5l"],["Ciucaș",9,"0.5l"],["Staropramen",12,"0.5l"]],
  tags:["Fumători afară","Cash & card"]},
 {c:"București", n:"Fabrica de Hamei", a:"Șos. Ștefan cel Mare 12, Floreasca", lat:44.4562, lng:26.1013,
  hours:[16,26], hh:{d:[3,4],from:17,to:20,deal:"2+1 la craft"},
  beers:[["Pale Ale local",15,"0.4l"],["Weissbier",16,"0.5l"],["Lager craft",14,"0.4l"]],
  tags:["Craft","Quiz miercuri","Pet friendly"]},
 {c:"București", n:"Pinta Studențească", a:"Bd. Regie 6, Grozăvești", lat:44.4442, lng:26.0530,
  hours:[15,28], hh:{d:[1,2,3,4],from:18,to:21,deal:"Ciucaș 6 lei"},
  beers:[["Ciucaș",7,"0.5l"],["Bergenbier",8,"0.5l"],["Ursus",9,"0.5l"]],
  tags:["Beer pong","Studenți","Cash"]},
 {c:"București", n:"Hop & Obor", a:"Piața Obor, Hala veche", lat:44.4499, lng:26.1266,
  hours:[10,23], hh:null,

// ---------------- Google Sheet loading ----------------
// Sheet columns, one row per bar (row 1 = headers, data from row 2):
//  A Oraș           B Nume            C Adresă
//  D Lat             E Lng             F Deschide (oră, 0-23)
//  G Închide (oră, 0-23 — ora reală de pe ceas; dacă e mai mică decât
//     "Deschide" înseamnă că închide după miezul nopții, ex. Deschide 20,
//     Închide 2 => program 20:00-02:00. Sistemul își dă seama singur.)
//  H HH Zile (ex. "Lun,Mar,Mie" — gol dacă nu are happy hour)
//  I HH De la (oră)  J HH Până la (oră)  K HH Ofertă (text)
//  L Beri — "Nume:Preț:Volum | Nume2:Preț2:Volum2" ex. "Ursus:13:0.4l | Pilsner Urquell:23:0.5l"
//     Aceeași bere în mai multe mărimi: pune preturile și volumele
//     separate prin "/", perechi pe poziție — ex. "Ursus:10/25:0.4l/1l"
//     apare într-un singur rând "Ursus 0.4l/1l" cu ambele prețuri,
//     fiecare colorat separat după propriul prag (10 lei verde, 25 lei galben).
//  M Tags — separate prin virgulă, ex. "Terasă, Card acceptat"
const SHEET_ID = "1g0h8zSAU3H1VnBUQfJk8aM6jqd5AXl0bthIDNscIdZA";
// sheet=Baruri pins the read to that exact tab name, so tab order in the
// spreadsheet (e.g. an "Instrucțiuni" tab placed first) never matters.
const SHEET_TAB_NAME = "Baruri";
const SHEET_GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(SHEET_TAB_NAME)}`;

function dayIndexFromLabel(raw){
  const s = raw.toString().trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const map = {dum:0, lun:1, mar:2, mie:3, joi:4, vin:5, sam:6};
  return map[s.slice(0,3)] ?? null;
}
function sheetCell(row, i){
  const cell = row.c && row.c[i];
  return (cell && cell.v !== null && cell.v !== undefined) ? cell.v : "";
}
function parseSheetBeers(raw){
  if(!raw) return [];
  return raw.toString().split("|").map(s=>s.trim()).filter(Boolean).map(entry=>{
    const [name, priceRaw, volRaw] = entry.split(":").map(s=>s ? s.trim() : s);
    // Support multiple sizes for one beer via slashes on both sides, e.g.
    // "Ursus:10/25:0.4l/1l" -> one menu line "Ursus 0.4l/1l" showing both
    // prices, each colored by its own tier. Prices/volumes pair by
    // position; a single value on one side is reused for every size.
    const priceParts = (priceRaw || "").split("/").map(s=>s.trim());
    const volParts = (volRaw || "").split("/").map(s=>s.trim());
    if(priceParts.length === 1 && volParts.length === 1){
      return [name || "Bere", Number(priceRaw) || 0, volRaw || ""];
    }
    const sizes = Math.max(priceParts.length, volParts.length);
    const prices = [], vols = [];
    for(let i=0;i<sizes;i++){
      prices.push(Number(priceParts[i] ?? priceParts[priceParts.length-1]) || 0);
      vols.push(volParts[i] ?? volParts[volParts.length-1] ?? "");
    }
    return [name || "Bere", prices, vols];
  });
}
function parseSheetTags(raw){
  return raw ? raw.toString().split(",").map(s=>s.trim()).filter(Boolean) : [];
}
function parseSheetRow(row){
  const c = sheetCell(row,0).toString().trim();
  const n = sheetCell(row,1).toString().trim();
  const latRaw = sheetCell(row,3), lngRaw = sheetCell(row,4);
  const openRaw = sheetCell(row,5), closeRaw = sheetCell(row,6);
  if(!c || !n || latRaw==="" || lngRaw==="" || openRaw==="" || closeRaw==="") return null;
  const lat = Number(latRaw), lng = Number(lngRaw);
  const openH = Number(openRaw);
  let closeH = Number(closeRaw);
  if(!isFinite(lat) || !isFinite(lng) || !isFinite(openH) || !isFinite(closeH)) return null;
  // Sheet holds real clock hours (0-23). A closing hour at/before the
  // opening hour means it closes after midnight — roll it past 24 here
  // so the rest of the app (which works in that "overflow" scale) needs
  // no further changes. E.g. Deschide 20, Închide 2 -> stored as [20,26].
  if(closeH <= openH) closeH += 24;

  const hhDaysRaw = sheetCell(row,7).toString();
  let hh = null;
  if(hhDaysRaw.trim()){
    const days = hhDaysRaw.split(",").map(dayIndexFromLabel).filter(d=>d!==null);
    const from = sheetCell(row,8), to = sheetCell(row,9);
    if(days.length && from!=="" && to!==""){
      hh = {d:days, from:Number(from), to:Number(to), deal:sheetCell(row,10).toString().trim()};
    }
  }

  return {
    c, n, a: sheetCell(row,2).toString().trim(), lat, lng,
    hours: [openH, closeH], hh,
    beers: parseSheetBeers(sheetCell(row,11)),
    tags: parseSheetTags(sheetCell(row,12)),
  };
}
async function loadBarsFromSheet(){
  const res = await fetch(SHEET_GVIZ_URL, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const text = await res.text();
  const jsonText = text.slice(text.indexOf("(")+1, text.lastIndexOf(")"));
  const data = JSON.parse(jsonText);
  const rows = (data.table && data.table.rows) || [];
  return rows.map(parseSheetRow).filter(Boolean);
}
function computeCities(bars){
  const byCity = {};
  bars.forEach(b=>{
    const key = byCity[b.c] || (byCity[b.c] = {n:b.c, lat:0, lng:0, count:0});
    key.lat += b.lat; key.lng += b.lng; key.count++;
  });
  return Object.values(byCity).map(c=>({n:c.n, lat:c.lat/c.count, lng:c.lng/c.count}));
}

const DAYS = ["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const RO_CENTER = [45.90, 25.00];
const RO_ZOOM_DESK = 7, RO_ZOOM_MOB = 6;
const CITY_ZOOM = 13;
const ZOOM_SPLIT = 10; // below this: city badges; at/above: bar caps
let userPos = null;

// ---------------- Helpers ----------------
const now = new Date();
const hourNow = now.getHours() + now.getMinutes()/60;
const dayNow = now.getDay();

function isOpen(b){
  const [o,c] = b.hours;
  const h = hourNow < 6 ? hourNow + 24 : hourNow;
  return h >= o && h < c;
}
function hasHHToday(b){ return !!(b.hh && b.hh.d.includes(dayNow)); }
function hhLive(b){ return hasHHToday(b) && hourNow >= b.hh.from && hourNow < b.hh.to; }
function cheapest(b){
  return Math.min(...b.beers.flatMap(x=>Array.isArray(x[1]) ? x[1] : [x[1]]));
}
function priceClass(price){
  if(price<=15) return "cheap";
  if(price<=25) return "mid";
  return "pricey";
}
function renderBeerRow(x){
  const prices = Array.isArray(x[1]) ? x[1] : [x[1]];
  const vols = Array.isArray(x[2]) ? x[2] : [x[2]];
  const volText = vols.join("/");
  const priceHtml = prices.map(p=>`<span class="bp ${priceClass(p)}">${p} lei</span>`).join('<span class="bp-sep">/</span>');
  return `<div class="beer"><span>${x[0]}<span class="bv">${volText}</span></span><span class="bp-group">${priceHtml}</span></div>`;
}
function fmtHours(b){
  const [o,c]=b.hours;
  return `${String(o).padStart(2,"0")}:00 – ${String(c%24).padStart(2,"0")}:00`;
}
function distKm(lat,lng,from){
  const R=6371, dLat=(lat-from.lat)*Math.PI/180, dLng=(lng-from.lng)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(from.lat*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function refPoint(){
  if(userPos) return userPos;
  const c = map.getCenter();
  return {lat:c.lat, lng:c.lng};
}

// ---------------- Map ----------------
const isMobile = matchMedia("(max-width:760px)").matches;
const map = L.map("map",{zoomControl:false, worldCopyJump:true})
  .setView(RO_CENTER, isMobile ? RO_ZOOM_MOB : RO_ZOOM_DESK);
map.setMaxBounds([[42.5,19.0],[49.3,31.5]]); // keep navigation around Romania
map.options.minZoom = 6;
L.control.zoom({position:"bottomleft"}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
}).addTo(map);

let markers = [];


// ---------------- Render ----------------
function render(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  const zoom = map.getZoom();
  const filtered = BARS;
  const ref = refPoint();

  if(zoom < ZOOM_SPLIT){
    // National view: one badge per city
    CITIES.forEach(city=>{
      const inCity = filtered.filter(b=>b.c===city.n);
      if(!inCity.length) return;
      const min = Math.min(...inCity.map(cheapest));
      const icon = L.divIcon({className:"capwrap", iconSize:null, iconAnchor:[36,20],
        html:`<div class="citycap" role="button" aria-label="${city.n}: ${inCity.length} baruri de la ${min} lei">
                <div class="cn">${city.n}</div>
                <div class="cs">${inCity.length} baruri · de la <b>${min} lei</b></div>
              </div>`});
      const m = L.marker([city.lat,city.lng],{icon}).addTo(map)
        .on("click",()=>goToCity(city));
      markers.push(m);
    });
  } else {
    // City view: bottle caps
    filtered.forEach(b=>{
      const open = isOpen(b);
      const cls = "cap" + (open ? " "+priceClass(cheapest(b)) : " closed") + (hhLive(b)?" hh":"");
      const icon = L.divIcon({className:"capwrap", iconSize:[46,46], iconAnchor:[23,23],
        html:`<div class="${cls}" role="button" aria-label="${b.n}, de la ${cheapest(b)} lei"><span class="from">de la</span><span class="lei">${cheapest(b)}</span><span class="cur">lei</span></div>`});
      const m = L.marker([b.lat,b.lng],{icon}).addTo(map).on("click",()=>openDetail(b));
      markers.push(m);
    });
  }

  // List: bars in current view (or whole country at national zoom)
  let listBars = zoom < ZOOM_SPLIT ? filtered
    : filtered.filter(b=>map.getBounds().pad(0.2).contains([b.lat,b.lng]));
  if(!listBars.length) listBars = filtered; // fallback so list is never empty
  listBars = [...listBars].sort((a,b)=> distKm(a.lat,a.lng,ref)-distKm(b.lat,b.lng,ref));

  document.getElementById("statCount").textContent =
    `${filtered.length} baruri în ${new Set(filtered.map(b=>b.c)).size} orașe`;
  document.getElementById("listCount").textContent = listBars.length;

  const list = document.getElementById("list");
  list.innerHTML = listBars.map(b=>{
    const open=isOpen(b);
    return `<button class="listrow ${open?"":"closed-row"}" data-i="${BARS.indexOf(b)}">
      <span class="mini">${cheapest(b)}</span>
      <span>
        <div class="rn">${b.n}</div>
        <div class="rm">${open?"Deschis":"Închis"} · de la ${cheapest(b)} lei
          ${hhLive(b)?'· <span class="tag-hh">Happy hour ACUM</span>':hasHHToday(b)?'· <span class="tag-hh">HH azi '+b.hh.from+'–'+b.hh.to+'</span>':""}
        </div>
      </span>
      <span class="dist">${distKm(b.lat,b.lng,ref).toFixed(1)} km<span class="cty">${b.c}</span></span>
    </button>`;
  }).join("") || `<div style="padding:24px 12px;font-size:14px;opacity:.7">Niciun bar nu trece de filtre. Ridică prețul maxim sau scoate un filtru.</div>`;

  list.querySelectorAll(".listrow").forEach(r=>r.addEventListener("click",()=>{
    const b = BARS[+r.dataset.i];
    map.flyTo([b.lat,b.lng], Math.max(map.getZoom(), CITY_ZOOM), {duration:.8});
    openDetail(b); toggleDrawer(false);
  }));
}

// ---------------- City navigation ----------------
const cityRow = document.getElementById("cityRow");
function buildCityChips(){
  cityRow.innerHTML = CITIES.map(c=>{
    const n = BARS.filter(b=>b.c===c.n).length;
    return `<button class="chip city" data-c="${c.n}" aria-pressed="false">${c.n} <span style="opacity:.6">${n}</span></button>`;
  }).join("");
  cityRow.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    goToCity(CITIES.find(c=>c.n===ch.dataset.c));
  }));
}
function markActiveCity(){
  const zoom = map.getZoom();
  const c = map.getCenter();
  let active = null;
  if(zoom >= ZOOM_SPLIT){
    active = CITIES.reduce((best,city)=>{
      const d = distKm(city.lat,city.lng,{lat:c.lat,lng:c.lng});
      return (!best || d < best.d) ? {n:city.n, d} : best;
    }, null);
    if(active && active.d > 60) active = null;
  }
  cityRow.querySelectorAll(".chip").forEach(ch=>{
    const on = active && ch.dataset.c === active.n;
    ch.classList.toggle("on", on);
    ch.setAttribute("aria-pressed", on ? "true" : "false");
  });
}
function goToCity(city){
  detail.classList.remove("open");
  map.flyTo([city.lat,city.lng], CITY_ZOOM, {duration:1.1});
}
document.getElementById("btnCountry").addEventListener("click",()=>{
  detail.classList.remove("open");
  map.flyTo(RO_CENTER, isMobile ? RO_ZOOM_MOB : RO_ZOOM_DESK, {duration:1.1});
});

// ---------------- Detail ----------------
const detail = document.getElementById("detail");
function openDetail(b){
  const open = isOpen(b);
  detail.innerHTML = `
    <div class="d-top">
      <div>
        <div class="d-name">${b.n}</div>
        <div class="d-meta">${b.a} · ${b.c} · ${distKm(b.lat,b.lng,refPoint()).toFixed(1)} km</div>
      </div>
      <button class="iconbtn" id="dClose" aria-label="Închide">✕</button>
    </div>
    <div class="status ${open?"o":"c"}"><span class="dot"></span>${open?"Deschis acum":"Închis acum"} · Program azi ${fmtHours(b)}</div>
    ${hasHHToday(b)?`<div class="hhbox">🍺 <b>Happy hour ${DAYS[dayNow].toLowerCase()}</b> ${b.hh.from}:00–${b.hh.to}:00 — ${b.hh.deal}${hhLive(b)?" · <b>chiar acum!</b>":""}</div>`:""}
    <div class="menu">
      <h3>Prețuri bere</h3>
      ${b.beers.map(renderBeerRow).join("")}
    </div>
    <div class="d-tags">${b.tags.map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="d-note">Prețuri actualizate de comunitate · MVP cu date demonstrative</div>`;
  addPanel.classList.remove("open");
  detail.classList.add("open");
  document.getElementById("dClose").addEventListener("click",()=>detail.classList.remove("open"));
}
map.on("click",()=>detail.classList.remove("open"));

const afLng = document.getElementById("afLng");
const afCitySelect = document.getElementById("afCitySelect");
const afCityNew = document.getElementById("afCityNew");
const beerList = document.getElementById("beerList");
const pinHint = document.getElementById("pinHint");
const afGeoQuery = document.getElementById("afGeoQuery");
const afGeoResults = document.getElementById("afGeoResults");

let pickingLocation = false;
let pinMarker = null;
let geoDebounceTimer = null;
let geoAbortController = null;

function populateCityOptions(){
  const keep = afCitySelect.value;
  const names = CITIES.map(c=>c.n).sort((a,b)=>a.localeCompare(b,"ro"));
  afCitySelect.innerHTML = `<option value="">— alege —</option>` +
    names.map(n=>`<option value="${n}">${n}</option>`).join("") +
    `<option value="__new__">+ Oraș nou</option>`;
  if(names.includes(keep)) afCitySelect.value = keep;
}
afCitySelect.addEventListener("change", ()=>{
  afCityNew.style.display = afCitySelect.value === "__new__" ? "block" : "none";
});

function setPinStatus(lat,lng){
  afPinStatus.textContent = `${(+lat).toFixed(4)}, ${(+lng).toFixed(4)}`;
  afPinStatus.classList.remove("err");
  afPinStatus.classList.add("set");
}
function placePin(lat,lng){
  if(pinMarker) map.removeLayer(pinMarker);
  pinMarker = L.marker([lat,lng]).addTo(map);
  afLat.value = (+lat).toFixed(5);
  afLng.value = (+lng).toFixed(5);
  setPinStatus(lat,lng);
}
function stopPicking(){
  pickingLocation = false;
  afPinBtn.classList.remove("picking");
  afPinBtn.textContent = "📍 pune pinul manual pe hartă";
  addPanel.classList.remove("picking");
  pinHint.classList.remove("show");
}
afPinBtn.addEventListener("click", ()=>{
  pickingLocation = !pickingLocation;
  afPinBtn.classList.toggle("picking", pickingLocation);
  afPinBtn.textContent = pickingLocation ? "📍 dă click pe hartă…" : "📍 pune pinul manual pe hartă";
  // Collapse the panel out of the way so the map underneath is visible
  // and tappable — otherwise there's nothing to click on mobile.
  addPanel.classList.toggle("picking", pickingLocation);
  pinHint.classList.toggle("show", pickingLocation);
});
map.on("click", (e)=>{
  if(!pickingLocation) return;
  placePin(e.latlng.lat, e.latlng.lng);
  afGeoResults.innerHTML = "";
  stopPicking();
});
[afLat, afLng].forEach(inp=>inp.addEventListener("input", ()=>{
  if(afLat.value!=="" && afLng.value!=="") setPinStatus(afLat.value, afLng.value);
}));

// ---------------- Address search (OpenStreetMap Nominatim) ----------------
// Public geocoding endpoint, no API key. Usage policy: max ~1 req/s, and
// results must credit OpenStreetMap contributors (shown under the list).
// https://nominatim.org/release-docs/latest/api/Search/
afGeoQuery.addEventListener("input", ()=>{
  clearTimeout(geoDebounceTimer);
  afPinStatus.classList.remove("err");
  const q = afGeoQuery.value.trim();
  if(q.length < 3){
    afGeoResults.innerHTML = "";
    return;
  }
  geoDebounceTimer = setTimeout(()=>geocodeAddress(q), 500);
});
afGeoQuery.addEventListener("keydown", (e)=>{
  // Enter would otherwise submit the whole form early — use it to search now instead.
  if(e.key === "Enter"){
    e.preventDefault();
    clearTimeout(geoDebounceTimer);
    const q = afGeoQuery.value.trim();
    if(q.length >= 3) geocodeAddress(q);
  }
});

async function geocodeAddress(query){
  const city = afCitySelect.value === "__new__" ? afCityNew.value.trim() : afCitySelect.value;
  const parts = [query, city, "România"].filter(Boolean);

  if(geoAbortController) geoAbortController.abort();
  geoAbortController = new AbortController();

  afGeoQuery.classList.add("loading");
  afGeoResults.innerHTML = `<div class="geo-results"><div class="geo-result" style="cursor:default;opacity:.5">Se caută…</div></div>`;

  try{
    const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=ro&q=" + encodeURIComponent(parts.join(", "));
    const res = await fetch(url, { headers: { "Accept-Language": "ro" }, signal: geoAbortController.signal });
    if(!res.ok) throw new Error("HTTP " + res.status);
    renderGeoResults(await res.json());
  }catch(err){
    if(err.name === "AbortError") return; // superseded by a newer keystroke
    console.warn("Geocodare eșuată:", err);
    afGeoResults.innerHTML = "";
    afPinStatus.textContent = "Căutarea a eșuat — încearcă din nou sau pune pinul manual";
    afPinStatus.classList.add("err");
  }finally{
    afGeoQuery.classList.remove("loading");
  }
}

function renderGeoResults(results){
  if(!results || !results.length){
    afGeoResults.innerHTML = `<div class="geo-results"><div class="geo-result" style="cursor:default;opacity:.6">Nicio potrivire — încearcă alt text sau pune pinul manual.</div></div>`;
    return;
  }
  afGeoResults.innerHTML = `<div class="geo-results">` +
    results.map((r,i)=>`<button type="button" class="geo-result" data-i="${i}">${r.display_name}</button>`).join("") +
    `<div class="geo-attrib">© OpenStreetMap contributors</div></div>`;
  afGeoResults.querySelectorAll(".geo-result").forEach(btn=>{
    if(btn.dataset.i === undefined) return;
    btn.addEventListener("click", ()=>{
      const r = results[+btn.dataset.i];
      afGeoQuery.value = r.display_name; // pastes the picked match into the field
      placePin(+r.lat, +r.lon);
      map.setView([+r.lat, +r.lon], Math.max(map.getZoom(), CITY_ZOOM));
      afGeoResults.innerHTML = "";
      autofillFromResult(r);
    });
  });
}

// Nominatim sometimes returns a POI name (if the place is already mapped
// in OpenStreetMap, e.g. an existing pub) plus a structured address
// breakdown (neighbourhood, city). Use whatever's there to save retyping
// — but only into fields the person hasn't already filled in themselves,
// never overwriting what they typed.
function autofillFromResult(r){
  const addr = r.address || {};
  const afName = document.getElementById("afName");
  if(!afName.value.trim() && r.name) afName.value = r.name;

  const neighborhood = addr.suburb || addr.neighbourhood || addr.city_district || addr.quarter || "";
  const afNeighborhood = document.getElementById("afNeighborhood");
  if(!afNeighborhood.value.trim() && neighborhood) afNeighborhood.value = neighborhood;

  const cityGuess = addr.city || addr.town || addr.municipality || addr.village || "";
  if(cityGuess && !afCitySelect.value){
    const match = [...afCitySelect.options].find(o=>o.value && o.value.toLowerCase() === cityGuess.toLowerCase());
    if(match){
      afCitySelect.value = match.value;
      afCityNew.style.display = "none";
    } else {
      afCitySelect.value = "__new__";
      afCityNew.style.display = "block";
      afCityNew.value = cityGuess;
    }
  }
}

function beerBlockHtml(){
  return `<div class="beer-block">
    <button type="button" class="beer-remove" aria-label="Șterge berea">✕</button>
    <div class="field-row">
      <div class="field"><label>Nume</label><input type="text" class="bfName" placeholder="ex. Ursus draft"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Preț (lei)</label><input type="number" class="bfPrice" min="0" step="0.5" placeholder="10"></div>
      <div class="field"><label>Volum</label><input type="text" class="bfVolume" list="volList" placeholder="0.5l"></div>
      <div class="field"><label>Tip</label>
        <select class="bfType">
          <option value="">—</option>
          <option value="Draft">Draft</option>
          <option value="Sticlă">Sticlă</option>
          <option value="Doză">Doză</option>
        </select>
      </div>
    </div>
  </div>`;
}
function addBeerRow(){
  const wrap = document.createElement("div");
  wrap.innerHTML = beerBlockHtml();
  const block = wrap.firstElementChild;
  block.querySelector(".beer-remove").addEventListener("click", ()=>{
    if(beerList.children.length > 1) block.remove();
  });
  beerList.appendChild(block);
}
document.getElementById("addBeerBtn").addEventListener("click", addBeerRow);
function resetBeerRows(){
  beerList.innerHTML = "";
  addBeerRow();
}

function showFormMsg(kind, text){
  afMsg.textContent = text;
  afMsg.className = "form-msg show " + kind;
}
function resetAddForm(){
  addForm.reset();
  afCityNew.style.display = "none";
  afPinStatus.textContent = "nesetat";
  afPinStatus.classList.remove("set","err");
  clearTimeout(geoDebounceTimer);
  if(geoAbortController) geoAbortController.abort();
  afGeoResults.innerHTML = "";
  afGeoQuery.classList.remove("loading");
  if(pinMarker){ map.removeLayer(pinMarker); pinMarker = null; }
  stopPicking();
  resetBeerRows();
  afMsg.className = "form-msg";
  afMsg.textContent = "";
  afSubmit.disabled = false;
  afSubmit.textContent = "Trimite barul";
}

function openAddPanel(){
  detail.classList.remove("open");
  toggleDrawer(false);
  populateCityOptions();
  resetAddForm();
  addPanel.classList.add("open");
}
function closeAddPanel(){
  addPanel.classList.remove("open");
  stopPicking();
}
document.getElementById("btnAdd").addEventListener("click", openAddPanel);
document.getElementById("addClose").addEventListener("click", closeAddPanel);

addForm.addEventListener("submit", async (e)=>{
  e.preventDefault();

  const name = document.getElementById("afName").value.trim();
  const neighborhood = document.getElementById("afNeighborhood").value.trim();
  const citySel = afCitySelect.value;
  const city = citySel === "__new__" ? afCityNew.value.trim() : citySel;
  const openRaw = document.getElementById("afOpen").value;
  const closeRaw = document.getElementById("afClose").value;
  const openHour = Number(openRaw), closeHour = Number(closeRaw);
  const lat = Number(afLat.value), lng = Number(afLng.value);

  const beers = [...beerList.querySelectorAll(".beer-block")].map(block=>({
    name: block.querySelector(".bfName").value.trim(),
    price: block.querySelector(".bfPrice").value,
    volume: block.querySelector(".bfVolume").value.trim(),
    type: block.querySelector(".bfType").value,
  })).filter(b=>b.name && b.price!=="");

  if(!name || !city || afLat.value==="" || afLng.value==="" || !isFinite(lat) || !isFinite(lng)
     || openRaw==="" || closeRaw==="" || !isFinite(openHour) || !isFinite(closeHour)){
    showFormMsg("err", "Completează numele, orașul, locația pe hartă (pin) și programul.");
    return;
  }
  if(!beers.length){
    showFormMsg("err", "Adaugă cel puțin o bere cu nume și preț.");
    return;
  }

  afSubmit.disabled = true;
  afSubmit.textContent = "Se trimite…";
  showFormMsg("", "");

  if(ADD_BAR_URL.indexOf("PASTE_") === 0){
    showFormMsg("err", "Formularul nu e conectat încă (lipsește adresa Apps Script în cod).");
    afSubmit.disabled = false;
    afSubmit.textContent = "Trimite barul";
    return;
  }

  try{
    const res = await fetch(ADD_BAR_URL, {
      method: "POST",
      body: JSON.stringify({ name, neighborhood, city, lat, lng, openHour, closeHour, beers }),
    });
    const result = await res.json().catch(()=>({ok:false, error:"Răspuns invalid de la server."}));
    if(!result.ok){
      showFormMsg("err", result.error || "Nu s-a putut trimite. Încearcă din nou.");
      afSubmit.disabled = false;
      afSubmit.textContent = "Trimite barul";
      return;
    }

    // Optimistic local update — visible instantly in this tab; everyone
    // else picks it up from the sheet on their next page load.
    let closeH = closeHour;
    if(closeH <= openHour) closeH += 24;
    BARS.push({
      c: city, n: name, a: neighborhood,
      lat, lng, hours:[openHour, closeH], hh:null,
      beers: beers.map(b=>[b.type ? `${b.name} (${b.type})` : b.name, Number(b.price)||0, b.volume||""]),
      tags: [],
    });
    CITIES = computeCities(BARS);
    buildCityChips();
    markActiveCity();
    render();

    showFormMsg("ok", "Adăugat! Apare acum pe hartă pentru tine — pentru toți ceilalți, la următoarea încărcare a paginii.");
    afSubmit.disabled = false;
    afSubmit.textContent = "Trimite barul";
    setTimeout(closeAddPanel, 1800);
  }catch(err){
    console.warn("Trimitere eșuată:", err);
    showFormMsg("err", "Nu s-a putut trimite (conexiune sau server indisponibil). Ce ai completat a rămas în formular — încearcă din nou.");
    afSubmit.disabled = false;
    afSubmit.textContent = "Trimite barul";
  }
});

// ---------------- Drawer ----------------
const drawer = document.getElementById("drawer");
function toggleDrawer(force){
  const open = force!==undefined ? force : !drawer.classList.contains("open");
  drawer.classList.toggle("open",open);
  document.getElementById("drawerToggle").setAttribute("aria-expanded",open);
  document.getElementById("drawerArrow").textContent = open ? "▼" : "▲";
}
document.getElementById("drawerToggle").addEventListener("click",()=>toggleDrawer());

// Re-render on navigation (debounced)
let t=null;
map.on("zoomend moveend",()=>{
  clearTimeout(t);
  t=setTimeout(()=>{render(); markActiveCity();},120);
});

// ---------------- Geolocation (optional) ----------------
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    userPos={lat:p.coords.latitude,lng:p.coords.longitude};
    render();
  },()=>{},{timeout:4000});
}

// ---------------- Boot: load live data, then render ----------------
async function init(){
  const badge = document.getElementById("dataBadge");
  let bars = null;
  try{
    bars = await loadBarsFromSheet();
  }catch(err){
    console.warn("Nu am putut încărca datele din Google Sheets:", err);
  }
  if(bars && bars.length){
    BARS = bars;
    badge.textContent = "Date live · Google Sheets";
  } else {
    BARS = FALLBACK_BARS;
    badge.textContent = "⚠ Sheet indisponibil · date demonstrative";
  }
  CITIES = computeCities(BARS);
  buildCityChips();
  render();
  markActiveCity();
}
init();
</script>
