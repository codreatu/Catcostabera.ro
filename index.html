<style>
  :root{
    --stout:#1B1207;
    --stout-2:#2A1D0E;
    --foam:#FBF3E4;
    --lager:#F0A31A;
    --amber:#C56E1A;
    --hop:#5B8A4A;
    --line:rgba(251,243,228,.14);
    --cheap:#5FAE4A;
    --mid:#F0A31A;
    --pricey:#D6503F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--stout);color:var(--foam);overflow:hidden}
  #map{position:fixed;inset:0;z-index:1;background:#12100c}
  .leaflet-container{font-family:'Archivo',sans-serif}

  /* ---------- Bottle-cap price markers ---------- */
  .cap{
    width:46px;height:46px;border-radius:50%;
    background:var(--lager);color:var(--stout);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:700;line-height:1;
    box-shadow:0 3px 10px rgba(0,0,0,.55);
    border:2px solid var(--stout);
    position:relative;transition:transform .12s ease;
  }
  .cap::before{
    content:"";position:absolute;inset:-5px;border-radius:50%;z-index:-1;
    background:repeating-conic-gradient(var(--lager) 0deg 9deg, transparent 9deg 18deg);
  }
  .cap.cheap{background:var(--cheap)}
  .cap.cheap::before{background:repeating-conic-gradient(var(--cheap) 0deg 9deg, transparent 9deg 18deg)}
  .cap.mid{background:var(--mid)}
  .cap.mid::before{background:repeating-conic-gradient(var(--mid) 0deg 9deg, transparent 9deg 18deg)}
  .cap.pricey{background:var(--pricey)}
  .cap.pricey::before{background:repeating-conic-gradient(var(--pricey) 0deg 9deg, transparent 9deg 18deg)}
  .cap.closed{background:#6b6257}
  .cap.closed::before{background:repeating-conic-gradient(#6b6257 0deg 9deg, transparent 9deg 18deg)}
  .cap.hh::after{
    content:"HH";position:absolute;top:-12px;right:-14px;
    background:var(--hop);color:var(--foam);font-size:9px;font-weight:700;
    padding:2px 5px;border-radius:99px;letter-spacing:.5px;border:1.5px solid var(--stout);
  }
  .cap .from{font-size:6px;font-weight:600;letter-spacing:.4px;text-transform:lowercase;opacity:.85;line-height:1}
  .cap .lei{font-size:14px;line-height:1}
  .cap .cur{font-size:8px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-top:1px}
  .cap:hover{transform:scale(1.12)}
  .capwrap{background:none;border:none}

  /* ---------- City aggregate markers (national zoom) ---------- */
  .citycap{
    min-width:72px;padding:8px 10px 7px;border-radius:12px;
    background:var(--stout);border:2px solid var(--lager);
    color:var(--foam);text-align:center;line-height:1.15;
    box-shadow:0 4px 14px rgba(0,0,0,.6);cursor:pointer;
    transition:transform .12s ease;white-space:nowrap;
  }
  .citycap:hover{transform:scale(1.07)}
  .citycap .cn{font-family:'Archivo Black';font-size:12px}
  .citycap .cs{font-size:10.5px;margin-top:2px;opacity:.9}
  .citycap .cs b{color:var(--lager)}

  /* ---------- Top bar ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    background:linear-gradient(to bottom, rgba(27,18,7,.96) 60%, rgba(27,18,7,0));
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:10px;pointer-events:auto}
  .brand-cap{
    width:34px;height:34px;border-radius:50%;flex:none;
    background:var(--lager);display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black';font-size:15px;color:var(--stout);
    box-shadow:inset 0 0 0 2px var(--stout), 0 0 0 3px var(--lager);
  }
  h1{font-family:'Archivo Black',sans-serif;font-size:19px;letter-spacing:.2px}
  h1 span{color:var(--lager)}
  .sub{font-size:11px;opacity:.75;margin-top:1px}

  .row{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px;pointer-events:auto;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{
    flex:none;display:flex;align-items:center;gap:6px;
    background:var(--stout-2);border:1px solid var(--line);color:var(--foam);
    font-family:'Archivo';font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;
  }
  .chip.on{background:var(--lager);color:var(--stout);border-color:var(--lager)}
  .chip.city.on{background:var(--foam);border-color:var(--foam)}
  .chip:focus-visible,.iconbtn:focus-visible,.listrow:focus-visible{outline:2px solid var(--lager);outline-offset:2px}
  .price-chip input{accent-color:var(--amber);width:90px}

  /* ---------- List drawer ---------- */
  .drawer{
    position:fixed;left:0;right:0;bottom:0;z-index:1001;
    background:var(--stout);border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    transform:translateY(calc(100% - 58px));
    transition:transform .25s ease;
    max-height:72vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .drawer.open{transform:translateY(0)}
  .drawer-handle{
    padding:10px 16px 12px;cursor:pointer;text-align:left;position:relative;
    background:none;border:none;color:var(--foam);width:100%;
    font-family:'Archivo';display:flex;align-items:center;justify-content:space-between;
  }
  .drawer-handle b{font-size:14px}
  .drawer-handle .bar-count{color:var(--lager)}
  .drawer-handle::before{
    content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:36px;height:4px;border-radius:99px;background:var(--line);
  }
  .list{overflow-y:auto;padding:0 8px 12px}
  .listrow{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--line);
    padding:12px 8px;cursor:pointer;color:var(--foam);font-family:'Archivo';
  }
  .listrow .mini{
    width:44px;height:44px;border-radius:50%;flex:none;
    background:var(--lager);color:var(--stout);font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .listrow.closed-row .mini{background:#6b6257}
  .listrow .rn{font-weight:700;font-size:14px}
  .listrow .rm{font-size:12px;opacity:.7;margin-top:2px}
  .listrow .tag-hh{color:#a5d194;font-weight:700}
  .listrow .dist{margin-left:auto;font-size:12px;opacity:.75;flex:none;text-align:right}
  .listrow .dist .cty{display:block;font-size:10px;opacity:.7}

  /* ---------- Detail card ---------- */
  .detail{
    position:fixed;left:0;right:0;bottom:0;z-index:1002;
    background:var(--stout);border-top:2px solid var(--lager);
    border-radius:18px 18px 0 0;
    transform:translateY(105%);transition:transform .25s ease;
    max-height:78vh;overflow-y:auto;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .detail.open{transform:translateY(0)}
  .d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .d-name{font-family:'Archivo Black';font-size:21px;line-height:1.15}
  .d-meta{font-size:13px;opacity:.75;margin-top:4px}
  .iconbtn{

  .status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-top:10px}
  .dot{width:8px;height:8px;border-radius:50%}

  .status.c{color:#e08a80}.status.c .dot{background:#e08a80}

  .beer{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
  .beer .bp{font-weight:700;color:var(--lager);font-size:15px}
  .beer .bp.cheap{color:var(--cheap)}
  .beer .bp.mid{color:var(--mid)}
  .beer .bp.pricey{color:var(--pricey)}
  .beer .bv{opacity:.55;font-size:12px;margin-left:6px}
  .d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .d-tags span{font-size:12px;background:var(--stout-2);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
  .d-note{font-size:11px;opacity:.5;margin-top:14px}

  .demo-badge{
    position:fixed;z-index:999;right:10px;bottom:66px;
    font-size:10px;letter-spacing:.6px;background:rgba(27,18,7,.85);
    border:1px solid var(--line);padding:4px 8px;border-radius:6px;opacity:.85;
  }
  .country-btn{
    position:fixed;z-index:999;left:10px;bottom:66px;
    background:rgba(27,18,7,.9);border:1px solid var(--line);color:var(--foam);
    font-family:'Archivo';font-size:12px;font-weight:600;
    padding:8px 12px;border-radius:99px;cursor:pointer;
  }
  .leaflet-control-attribution{background:rgba(27,18,7,.7)!important;color:#a99!important;font-size:9px!important}
  .leaflet-control-attribution a{color:#c9a!important}
  @media (prefers-reduced-motion: reduce){.drawer,.detail,.cap,.citycap{transition:none}}
  @media(min-width:760px){
    .drawer,.detail{left:auto;right:16px;width:400px;border-radius:14px}
    .drawer{bottom:16px}
    .detail{bottom:16px;border:1px solid var(--line);border-top:2px solid var(--lager)}
  }
</style>
</head>

//     "Deschide" înseamnă că închide după miezul nopții, ex. Deschide 20,
//     Închide 2 => program 20:00-02:00. Sistemul își dă seama singur.)
//  H HH Zile (ex. "Lun,Mar,Mie" — gol dacă nu are happy hour)
//  I HH De la (oră)  J HH Până la (oră)  K HH Ofertă (text)
//  L Beri — "Nume:Preț:Volum | Nume2:Preț2:Volum2" ex. "Ursus:13:0.4l | Pilsner Urquell:23:0.5l"
//  M Tags — separate prin virgulă, ex. "Terasă, Card acceptat"
const SHEET_ID = "1k3hrKZOD0iNxNxTQ6D875JaoGockyeuN";
// sheet=Baruri pins the read to that exact tab name, so tab order in the
// spreadsheet (e.g. an "Instrucțiuni" tab placed first) never matters.
const SHEET_TAB_NAME = "Baruri";
const SHEET_GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(SHEET_TAB_NAME)}`;

function dayIndexFromLabel(raw){
  const s = raw.toString().trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const map = {dum:0, lun:1, mar:2, mie:3, joi:4, vin:5, sam:6};
  return map[s.slice(0,3)] ?? null;
}
function sheetCell(row, i){
  const cell = row.c && row.c[i];
  return (cell && cell.v !== null && cell.v !== undefined) ? cell.v : "";
}
function parseSheetBeers(raw){
  if(!raw) return [];
  return raw.toString().split("|").map(s=>s.trim()).filter(Boolean).map(entry=>{
    const [name, price, vol] = entry.split(":").map(s=>s ? s.trim() : s);
    return [name || "Bere", Number(price) || 0, vol || ""];
  });
}
function parseSheetTags(raw){
  return raw ? raw.toString().split(",").map(s=>s.trim()).filter(Boolean) : [];
}
function parseSheetRow(row){
  const c = sheetCell(row,0).toString().trim();
  const n = sheetCell(row,1).toString().trim();
  const latRaw = sheetCell(row,3), lngRaw = sheetCell(row,4);
  const openRaw = sheetCell(row,5), closeRaw = sheetCell(row,6);
  if(!c || !n || latRaw==="" || lngRaw==="" || openRaw==="" || closeRaw==="") return null;
  const lat = Number(latRaw), lng = Number(lngRaw);
  const openH = Number(openRaw);
  let closeH = Number(closeRaw);
  if(!isFinite(lat) || !isFinite(lng) || !isFinite(openH) || !isFinite(closeH)) return null;
  // Sheet holds real clock hours (0-23). A closing hour at/before the
  // opening hour means it closes after midnight — roll it past 24 here
  // so the rest of the app (which works in that "overflow" scale) needs
  // no further changes. E.g. Deschide 20, Închide 2 -> stored as [20,26].
  if(closeH <= openH) closeH += 24;

  const hhDaysRaw = sheetCell(row,7).toString();
  let hh = null;
  if(hhDaysRaw.trim()){
    const days = hhDaysRaw.split(",").map(dayIndexFromLabel).filter(d=>d!==null);
    const from = sheetCell(row,8), to = sheetCell(row,9);
    if(days.length && from!=="" && to!==""){
      hh = {d:days, from:Number(from), to:Number(to), deal:sheetCell(row,10).toString().trim()};
    }
  }

  return {
    c, n, a: sheetCell(row,2).toString().trim(), lat, lng,
    hours: [openH, closeH], hh,
    beers: parseSheetBeers(sheetCell(row,11)),
    tags: parseSheetTags(sheetCell(row,12)),
  };
}
async function loadBarsFromSheet(){
  const res = await fetch(SHEET_GVIZ_URL, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const text = await res.text();
  const jsonText = text.slice(text.indexOf("(")+1, text.lastIndexOf(")"));
  const data = JSON.parse(jsonText);
  const rows = (data.table && data.table.rows) || [];
  return rows.map(parseSheetRow).filter(Boolean);
}
function computeCities(bars){
  const byCity = {};
  bars.forEach(b=>{
    const key = byCity[b.c] || (byCity[b.c] = {n:b.c, lat:0, lng:0, count:0});
    key.lat += b.lat; key.lng += b.lng; key.count++;
  });
  return Object.values(byCity).map(c=>({n:c.n, lat:c.lat/c.count, lng:c.lng/c.count}));
}

const DAYS = ["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const RO_CENTER = [45.90, 25.00];
const RO_ZOOM_DESK = 7, RO_ZOOM_MOB = 6;
const CITY_ZOOM = 13;
const ZOOM_SPLIT = 10; // below this: city badges; at/above: bar caps
let userPos = null;

// ---------------- Helpers ----------------
const now = new Date();
const hourNow = now.getHours() + now.getMinutes()/60;
const dayNow = now.getDay();

function isOpen(b){
  const [o,c] = b.hours;
  const h = hourNow < 6 ? hourNow + 24 : hourNow;
  return h >= o && h < c;
}
function hasHHToday(b){ return !!(b.hh && b.hh.d.includes(dayNow)); }
function hhLive(b){ return hasHHToday(b) && hourNow >= b.hh.from && hourNow < b.hh.to; }
function cheapest(b){ return Math.min(...b.beers.map(x=>x[1])); }
function priceClass(price){
  if(price<=15) return "cheap";
  if(price<=25) return "mid";
  return "pricey";
}
function fmtHours(b){
  const [o,c]=b.hours;
  return `${String(o).padStart(2,"0")}:00 – ${String(c%24).padStart(2,"0")}:00`;
}
function distKm(lat,lng,from){
  const R=6371, dLat=(lat-from.lat)*Math.PI/180, dLng=(lng-from.lng)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(from.lat*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function refPoint(){
  if(userPos) return userPos;
  const c = map.getCenter();
  return {lat:c.lat, lng:c.lng};
}

// ---------------- Map ----------------
const isMobile = matchMedia("(max-width:760px)").matches;
const map = L.map("map",{zoomControl:false, worldCopyJump:true})
  .setView(RO_CENTER, isMobile ? RO_ZOOM_MOB : RO_ZOOM_DESK);
map.setMaxBounds([[42.5,19.0],[49.3,31.5]]); // keep navigation around Romania
map.options.minZoom = 6;
L.control.zoom({position:"bottomleft"}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
}).addTo(map);

let markers = [];

// ---------------- Filters ----------------
const state = {open:false, hh:false, maxPrice:25, cheapSort:false, city:null};

function passes(b){
  if(state.open && !isOpen(b)) return false;
  if(state.hh && !hasHHToday(b)) return false;
  if(cheapest(b) > state.maxPrice) return false;
  return true;
}

// ---------------- Render ----------------
function render(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  const zoom = map.getZoom();
  const filtered = BARS.filter(passes);
  const ref = refPoint();

  if(zoom < ZOOM_SPLIT){
    // National view: one badge per city
    CITIES.forEach(city=>{
      const inCity = filtered.filter(b=>b.c===city.n);
      if(!inCity.length) return;
      const min = Math.min(...inCity.map(cheapest));
      const icon = L.divIcon({className:"capwrap", iconSize:null, iconAnchor:[36,20],
        html:`<div class="citycap" role="button" aria-label="${city.n}: ${inCity.length} baruri de la ${min} lei">
                <div class="cn">${city.n}</div>
                <div class="cs">${inCity.length} baruri · de la <b>${min} lei</b></div>
              </div>`});
      const m = L.marker([city.lat,city.lng],{icon}).addTo(map)
        .on("click",()=>goToCity(city));
      markers.push(m);
    });
  } else {
    // City view: bottle caps
    filtered.forEach(b=>{
      const open = isOpen(b);
      const cls = "cap" + (open ? " "+priceClass(cheapest(b)) : " closed") + (hhLive(b)?" hh":"");
      const icon = L.divIcon({className:"capwrap", iconSize:[46,46], iconAnchor:[23,23],
        html:`<div class="${cls}" role="button" aria-label="${b.n}, de la ${cheapest(b)} lei"><span class="from">de la</span><span class="lei">${cheapest(b)}</span><span class="cur">lei</span></div>`});
      const m = L.marker([b.lat,b.lng],{icon}).addTo(map).on("click",()=>openDetail(b));
      markers.push(m);
    });
  }

  // List: bars in current view (or whole country at national zoom)
  let listBars = zoom < ZOOM_SPLIT ? filtered
    : filtered.filter(b=>map.getBounds().pad(0.2).contains([b.lat,b.lng]));
  if(!listBars.length) listBars = filtered; // fallback so list is never empty
  listBars = [...listBars].sort((a,b)=> state.cheapSort
    ? cheapest(a)-cheapest(b)
    : distKm(a.lat,a.lng,ref)-distKm(b.lat,b.lng,ref));

  document.getElementById("statCount").textContent =
    `${filtered.length} baruri în ${new Set(filtered.map(b=>b.c)).size} orașe`;
  document.getElementById("listCount").textContent = listBars.length;

  const list = document.getElementById("list");
  list.innerHTML = listBars.map(b=>{
    const open=isOpen(b);
    return `<button class="listrow ${open?"":"closed-row"}" data-i="${BARS.indexOf(b)}">
      <span class="mini">${cheapest(b)}</span>
      <span>
        <div class="rn">${b.n}</div>
        <div class="rm">${open?"Deschis":"Închis"} · de la ${cheapest(b)} lei
          ${hhLive(b)?'· <span class="tag-hh">Happy hour ACUM</span>':hasHHToday(b)?'· <span class="tag-hh">HH azi '+b.hh.from+'–'+b.hh.to+'</span>':""}
        </div>
      </span>
      <span class="dist">${distKm(b.lat,b.lng,ref).toFixed(1)} km<span class="cty">${b.c}</span></span>
    </button>`;
  }).join("") || `<div style="padding:24px 12px;font-size:14px;opacity:.7">Niciun bar nu trece de filtre. Ridică prețul maxim sau scoate un filtru.</div>`;

  list.querySelectorAll(".listrow").forEach(r=>r.addEventListener("click",()=>{
    const b = BARS[+r.dataset.i];
    map.flyTo([b.lat,b.lng], Math.max(map.getZoom(), CITY_ZOOM), {duration:.8});
    openDetail(b); toggleDrawer(false);
  }));
}

// ---------------- City navigation ----------------
const cityRow = document.getElementById("cityRow");
function buildCityChips(){
  cityRow.innerHTML = CITIES.map(c=>{
    const n = BARS.filter(b=>b.c===c.n).length;
    return `<button class="chip city" data-c="${c.n}" aria-pressed="false">${c.n} <span style="opacity:.6">${n}</span></button>`;
  }).join("");
  cityRow.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    goToCity(CITIES.find(c=>c.n===ch.dataset.c));
  }));
}
function markActiveCity(){
  const zoom = map.getZoom();
  const c = map.getCenter();
  let active = null;
  if(zoom >= ZOOM_SPLIT){
    active = CITIES.reduce((best,city)=>{
      const d = distKm(city.lat,city.lng,{lat:c.lat,lng:c.lng});
      return (!best || d < best.d) ? {n:city.n, d} : best;
    }, null);
    if(active && active.d > 60) active = null;
  }
  cityRow.querySelectorAll(".chip").forEach(ch=>{
    const on = active && ch.dataset.c === active.n;
    ch.classList.toggle("on", on);
    ch.setAttribute("aria-pressed", on ? "true" : "false");
  });
}
function goToCity(city){
  detail.classList.remove("open");
  map.flyTo([city.lat,city.lng], CITY_ZOOM, {duration:1.1});
}
document.getElementById("btnCountry").addEventListener("click",()=>{
  detail.classList.remove("open");
  map.flyTo(RO_CENTER, isMobile ? RO_ZOOM_MOB : RO_ZOOM_DESK, {duration:1.1});
});

// ---------------- Detail ----------------
const detail = document.getElementById("detail");
function openDetail(b){
  const open = isOpen(b);
  detail.innerHTML = `
    <div class="d-top">
      <div>
        <div class="d-name">${b.n}</div>
        <div class="d-meta">${b.a} · ${b.c} · ${distKm(b.lat,b.lng,refPoint()).toFixed(1)} km</div>
      </div>
      <button class="iconbtn" id="dClose" aria-label="Închide">✕</button>
    </div>
    <div class="status ${open?"o":"c"}"><span class="dot"></span>${open?"Deschis acum":"Închis acum"} · Program azi ${fmtHours(b)}</div>
    ${hasHHToday(b)?`<div class="hhbox">🍺 <b>Happy hour ${DAYS[dayNow].toLowerCase()}</b> ${b.hh.from}:00–${b.hh.to}:00 — ${b.hh.deal}${hhLive(b)?" · <b>chiar acum!</b>":""}</div>`:""}
    <div class="menu">
      <h3>Prețuri bere</h3>
      ${b.beers.map(x=>`<div class="beer"><span>${x[0]}<span class="bv">${x[2]}</span></span><span class="bp ${priceClass(x[1])}">${x[1]} lei</span></div>`).join("")}
    </div>
    <div class="d-tags">${b.tags.map(t=>`<span>${t}</span>`).join("")}</div>
    <div class="d-note">Prețuri actualizate de comunitate · MVP cu date demonstrative</div>`;
  detail.classList.add("open");
  document.getElementById("dClose").addEventListener("click",()=>detail.classList.remove("open"));
}
map.on("click",()=>detail.classList.remove("open"));

// ---------------- Drawer ----------------
const drawer = document.getElementById("drawer");
function toggleDrawer(force){
  const open = force!==undefined ? force : !drawer.classList.contains("open");
  drawer.classList.toggle("open",open);
  document.getElementById("drawerToggle").setAttribute("aria-expanded",open);
  document.getElementById("drawerArrow").textContent = open ? "▼" : "▲";
}
document.getElementById("drawerToggle").addEventListener("click",()=>toggleDrawer());

// ---------------- Filter wiring ----------------
function wireChip(id,key){
  const el=document.getElementById(id);
  el.addEventListener("click",()=>{
    state[key]=!state[key];
    el.classList.toggle("on",state[key]);
    el.setAttribute("aria-pressed",state[key]);
    render();
  });
}
wireChip("fOpen","open"); wireChip("fHH","hh"); wireChip("fCheap","cheapSort");
document.getElementById("fPrice").addEventListener("input",e=>{
  state.maxPrice=+e.target.value;
  document.getElementById("pv").textContent=e.target.value;
  render();
});

// Re-render on navigation (debounced)
let t=null;
map.on("zoomend moveend",()=>{
  clearTimeout(t);
  t=setTimeout(()=>{render(); markActiveCity();},120);
});

// ---------------- Geolocation (optional) ----------------
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    userPos={lat:p.coords.latitude,lng:p.coords.longitude};
    render();
  },()=>{},{timeout:4000});
}

// ---------------- Boot: load live data, then render ----------------
async function init(){
  const badge = document.getElementById("dataBadge");
  let bars = null;
  try{
    bars = await loadBarsFromSheet();
  }catch(err){
    console.warn("Nu am putut încărca datele din Google Sheets:", err);
  }
  if(bars && bars.length){
    BARS = bars;
    badge.textContent = "Date live · Google Sheets";
  } else {
    BARS = FALLBACK_BARS;
    badge.textContent = "⚠ Sheet indisponibil · date demonstrative";
  }
  CITIES = computeCities(BARS);
  buildCityChips();
  render();
  markActiveCity();
}
init();
</script>
</body>
</html>
